<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CRM de prueba · fichas de viviendas</title>
<style>
  :root { --tinta: #1d2430; --suave: #5b6676; --linea: #e3e6ea; --fondo: #f6f7f9; --acento: #1f5fbf; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--tinta); background: var(--fondo); }
  header { padding: 20px 16px 8px; max-width: 880px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  header p { margin: 0; color: var(--suave); font-size: 13px; }
  main { max-width: 880px; margin: 0 auto; padding: 8px 16px 40px; display: grid; gap: 12px; }
  .ficha { background: #fff; border: 1px solid var(--linea); border-radius: 10px; padding: 16px; scroll-margin-top: 12px; }
  .ficha.activa { border-color: var(--acento); box-shadow: 0 0 0 3px rgba(31, 95, 191, .15); }
  .cab { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
  .cod { font: 600 13px/1 ui-monospace, Menlo, monospace; color: var(--acento); }
  .precio { font-size: 18px; font-weight: 700; }
  h2 { font-size: 16px; margin: 6px 0 2px; }
  .dir { color: var(--suave); margin: 0 0 10px; }
  .datos { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 12px; color: var(--suave); font-size: 14px; }
  .gente { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
  .gente div { background: var(--fondo); border-radius: 8px; padding: 10px 12px; }
  .gente span { display: block; font-size: 12px; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; }
  .gente a { color: var(--tinta); }
  /* galería: foto grande + 3 pequeñas; en móvil, tira deslizable */
  .fotos { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; aspect-ratio: 16 / 7;
           margin: -16px -16px 14px; border-radius: 9px 9px 0 0; overflow: hidden; background: var(--linea); }
  .fotos button { all: unset; cursor: zoom-in; position: relative; overflow: hidden; background: var(--linea); }
  .fotos button:focus-visible { outline: 3px solid var(--acento); outline-offset: -3px; }
  .fotos button:first-child { grid-row: 1 / 3; }
  .fotos button:nth-child(4) { grid-column: 2 / 4; }
  .fotos img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s ease; }
  .fotos button:hover img { transform: scale(1.03); }
  .fotos .num { position: absolute; right: 8px; bottom: 8px; background: rgba(0, 0, 0, .62); color: #fff; font-size: 12px;
                padding: 3px 9px; border-radius: 99px; pointer-events: none; }
  @media (max-width: 560px) {
    .fotos { display: flex; aspect-ratio: auto; height: 230px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .fotos button { flex: 0 0 86%; scroll-snap-align: start; }
    .fotos button:first-child .num { display: block; }
  }
  /* visor a pantalla completa */
  #visor { border: 0; padding: 0; background: transparent; width: min(1100px, 94vw); max-width: none; overflow: visible; }
  #visor::backdrop { background: rgba(10, 14, 20, .9); }
  #visor figure { margin: 0; }
  #visor img { width: 100%; max-height: 80vh; object-fit: contain; display: block; border-radius: 6px; }
  #visor figcaption { display: flex; justify-content: space-between; gap: 12px; color: #e8ebef; font-size: 14px; padding: 10px 2px 0; }
  #visor button { position: fixed; width: 44px; height: 44px; border: 0; border-radius: 50%; cursor: pointer; color: #fff;
                  background: rgba(255, 255, 255, .14); font: 22px/44px system-ui, sans-serif; text-align: center; padding: 0; }
  #visor button:hover, #visor button:focus-visible { background: rgba(255, 255, 255, .28); outline: none; }
  #visor .ant { left: 12px; top: calc(50% - 22px); }
  #visor .sig { right: 12px; top: calc(50% - 22px); }
  #visor .cerrar { right: 12px; top: 12px; font-size: 18px; }
</style>
</head>
<body>
<header>
  <h1>CRM de prueba · viviendas</h1>
  <p>Simulación: propietarios y teléfonos ficticios; fotos de ejemplo de Unsplash. Cada ficha se consulta también en <code>api/viviendas/&lt;código&gt;.json</code>.</p>
</header>
<main id="lista" aria-live="polite"></main>
<dialog id="visor" aria-label="Fotos de la vivienda">
  <figure><img alt=""><figcaption></figcaption></figure>
  <button type="button" class="ant" aria-label="Foto anterior">‹</button>
  <button type="button" class="sig" aria-label="Foto siguiente">›</button>
  <button type="button" class="cerrar" aria-label="Cerrar">✕</button>
</dialog>
<script>
  const eur = (n) => n.toLocaleString('es-ES') + ' €';
  const tel = (t) => `<a href="tel:${t}">${t.replace(/^\+34(\d{3})(\d{3})(\d{3})$/, '+34 $1 $2 $3')}</a>`;
  const porCodigo = {};
  // galería de la ficha: la página usa la versión de 720 px (-m.jpg); el visor, la de 1600 px
  const galeria = (v) => !(v.fotos && v.fotos.length) ? '' : `<div class="fotos">${v.fotos.slice(0, 4).map((f, i) => `
        <button type="button" data-cod="${v.codigo}" data-i="${i}" aria-label="Ver foto: ${f.pie}">
          <img src="${f.archivo.replace(/\.jpg$/, '-m.jpg')}" alt="${f.pie}" width="720" height="540" ${i ? 'loading="lazy"' : ''}>
          ${i === 0 ? `<span class="num" hidden>${v.fotos.length} fotos</span>` : ''}
        </button>`).join('')}</div>`;
  fetch('api/viviendas/index.json').then((r) => r.json()).then((vs) => {
    vs.forEach((v) => { porCodigo[v.codigo] = v; });
    document.getElementById('lista').innerHTML = vs.map((v) => `
      <article class="ficha" id="${v.codigo}">
        ${galeria(v)}
        <div class="cab"><span class="cod">${v.codigo}</span><span class="precio">${eur(v.precio)}</span></div>
        <h2>${v.tipo[0].toUpperCase() + v.tipo.slice(1)} en ${v.zona}</h2>
        <p class="dir">${v.direccion} · ${v.ciudad}</p>
        <p class="datos"><span>${v.habitaciones} hab.</span><span>${v.banos} baños</span><span>${v.metros} m²</span>${(v.extras || []).map((x) => `<span>${x}</span>`).join('')}<span>${v.estado}</span></p>
        <p>${v.descripcion}</p>
        <div class="gente">
          <div><span>Propietario</span>${v.propietario.nombre} · ${tel(v.propietario.telefono)}</div>
          <div><span>Captada por</span>${v.captador.nombre} · ${tel(v.captador.telefono)}</div>
        </div>
      </article>`).join('');
    marcar();
  });
  // la ficha del enlace (#código) queda resaltada y a la vista
  function marcar() {
    document.querySelectorAll('.ficha.activa').forEach((x) => x.classList.remove('activa'));
    const el = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (el) { el.classList.add('activa'); el.scrollIntoView({ block: 'start' }); }
  }
  addEventListener('hashchange', marcar);

  // visor: clic en una foto → grande, con flechas (también teclado ← →) y Esc o clic fuera para cerrar
  const visor = document.getElementById('visor');
  let actual = null, idx = 0;
  function mostrar() {
    const f = actual.fotos[idx], img = visor.querySelector('img');
    img.src = f.archivo; img.alt = f.pie;
    visor.querySelector('figcaption').innerHTML = `<span>${f.pie} · ${actual.codigo}</span><span>${idx + 1} / ${actual.fotos.length}</span>`;
  }
  const mover = (d) => { idx = (idx + d + actual.fotos.length) % actual.fotos.length; mostrar(); };
  document.getElementById('lista').addEventListener('click', (e) => {
    const b = e.target.closest('.fotos button');
    if (!b) return;
    actual = porCodigo[b.dataset.cod]; idx = +b.dataset.i;
    mostrar(); visor.showModal();
  });
  visor.querySelector('.ant').addEventListener('click', () => mover(-1));
  visor.querySelector('.sig').addEventListener('click', () => mover(1));
  visor.querySelector('.cerrar').addEventListener('click', () => visor.close());
  visor.addEventListener('click', (e) => { if (e.target === visor) visor.close(); });
  visor.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') mover(-1); if (e.key === 'ArrowRight') mover(1); });
</script>
</body>
</html>
